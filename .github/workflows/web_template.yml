name: web-template-2d
# Builds a smaller 2D-only Godot web export template (no 3D, size-optimised, single-threaded).
# Manual: gh workflow run web-template-2d. Artifact: web_nothreads_release_2d.zip (drop into the export templates
# folder as web_nothreads_release.zip, or point the Web preset's custom_template/release at it).
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_TAG: 4.7.2-stable
  EM_VERSION: 4.0.11  # what Godot 4.7.2's own web_builds.yml uses

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Godot
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_TAG }}
          submodules: recursive
      - name: Emscripten
        uses: emscripten-core/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true
      - name: SCons
        run: python -m pip install scons
      - name: Compile
        run: >-
          scons platform=web target=template_release threads=no arch=wasm32
          disable_3d=yes optimize=size lto=full debug_symbols=no deprecated=no
          module_text_server_adv_enabled=no module_text_server_fb_enabled=yes
          -j$(nproc)
      - name: Package
        run: |
          ls -la bin
          cp bin/godot.web.template_release.wasm32.nothreads.zip web_nothreads_release_2d.zip
      - uses: actions/upload-artifact@v4
        with:
          name: web_nothreads_release_2d
          path: web_nothreads_release_2d.zip
      # Also attach it to a DRAFT release (not public; Curtis approved 18 Nov) so tools can fetch it.
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view web-template-2d -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create web-template-2d -R "$GITHUB_REPOSITORY" --draft --title "2D web template (internal)" \
              --notes "Built by the web-template-2d workflow. Draft, not public."
          gh release upload web-template-2d web_nothreads_release_2d.zip -R "$GITHUB_REPOSITORY" --clobber
