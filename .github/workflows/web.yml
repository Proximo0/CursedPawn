# Playable web build. Every PR and push exports the Web preset (Compatibility, single-threaded), boots it in headless
# Chrome (tools/web_smoke.mjs: engine starts, no errors, a full screen draws) and keeps it as a `web` artifact;
# pushes to main also deploy it to GitHub Pages, so the newest main is one tap away on a phone.
# One-time setup by the repo owner: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until then the deploy job fails and the artifact still works.
name: web

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # draft releases (the 2D web engine lives on one) are only visible to a token with write access
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Export
        env:
          GH_TOKEN: ${{ github.token }}  # tools/fetch_web_template.sh reads the 2D engine from the draft release
        run: tools/export_web.sh
      - name: Boot in headless Chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1 >/dev/null
          node tools/web_smoke.mjs build/web --chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke
          path: build/web_smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          name: web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: web
