# Playable web build. Runs after merge only (pushes to main), not on PRs, to keep the merge loop short. Exports the Web preset (Compatibility, single-threaded), boots it in headless
# Chrome (tools/web_smoke.mjs: engine starts, no errors, a full screen draws, the play-bot finishes a run with the
# same final state as the native build) and keeps it as a `web` artifact;
# pushes to main also deploy it to GitHub Pages, so the newest main is one tap away on a phone.
# One-time setup by the repo owner: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until then the deploy job fails and the artifact still works.
name: web

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # draft releases (the 2D web engine lives on one) are only visible to a token with write access
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Export
        env:
          GH_TOKEN: ${{ github.token }}  # tools/fetch_web_template.sh reads the 2D engine from the draft release
        run: tools/export_web.sh
      - name: Cache Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-shell-${{ runner.os }}
      - name: Boot and bot run in headless Chrome
        run: |
          # Same Playwright and bundled Chromium as the cloud sessions (the runner's own Chrome hung after engine start).
          # The cache above skips the npm and browser install after the first run.
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npm install --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
            npx playwright install --only-shell chromium >/dev/null
          fi
          # The play-bot plays one whole run natively, then the same run in the browser; their final state hashes must match.
          H=$(timeout 120 godot --headless --path . -- --scripted --bot=greedy --seed=7 2>&1 | sed -n 's/^BOT .*hash=//p')
          [ -n "$H" ] || { echo "native bot run printed no BOT line"; exit 1; }
          SMOKE_BOT=greedy SMOKE_BOT_HASH=$H SMOKE_SHOT_B64=1 SMOKE_TIMEOUT_MS=60000 node tools/web_smoke.mjs build/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke
          path: build/web_smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          name: web

  # Linux download: exported with tools/export_linux.sh, then the exported binary plays a whole run headless (--smoke).
  # Kept as an artifact only; it is not a required check and publishes nothing.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Export and smoke
        run: tools/export_linux.sh --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/Cursed-Pawn-linux.zip
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: web
